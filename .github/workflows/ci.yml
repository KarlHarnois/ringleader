name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Restore cargo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('flake.lock') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ hashFiles('flake.lock') }}-
      - name: Format
        run: nix develop -c cargo fmt --check
      - name: Lint
        run: nix develop -c cargo clippy --all-targets -- -D warnings
      - name: Test
        run: nix develop -c cargo test
      - name: Version badge
        run: nix build --no-link .#checks.x86_64-linux.readme-version-badge
      - name: Check agent docs
        run: nix build --no-link .#checks.x86_64-linux.agent-docs
      - name: Build
        if: github.event_name != 'pull_request'
        run: nix build .#
      - name: Flake check
        if: github.event_name != 'pull_request'
        run: nix flake check
      - name: Save cargo cache
        if: github.ref == 'refs/heads/master' && !cancelled()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('flake.lock') }}-${{ hashFiles('Cargo.lock') }}
