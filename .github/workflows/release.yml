name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

env:
  CACHIX_CACHE: ringleader

jobs:
  tag:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Find the commits since the latest release
        id: since
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if git merge-base --is-ancestor "$COMMIT" "$latest"; then
            echo "$latest already releases $COMMIT"
          else
            echo "latest=$latest" >> "$GITHUB_OUTPUT"
            echo "commits=$(git rev-list --first-parent "$latest..$COMMIT" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect the release labels of their pull requests
        id: labels
        if: steps.since.outputs.latest != ''
        env:
          GH_TOKEN: ${{ github.token }}
          COMMITS: ${{ steps.since.outputs.commits }}
        run: |
          labels=$(for commit in $COMMITS; do
            gh api "repos/$GITHUB_REPOSITORY/commits/$commit/pulls" --jq '.[].labels[].name'
          done | sort -u | tr '\n' ' ')
          echo "labels=$labels" >> "$GITHUB_OUTPUT"
      - if: steps.since.outputs.latest != ''
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - if: steps.since.outputs.latest != ''
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Tag the commit
        id: tag
        if: steps.since.outputs.latest != ''
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.since.outputs.latest }}
          LABELS: ${{ steps.labels.outputs.labels }}
        run: |
          read -ra labels <<< "$LABELS"
          tag=$(nix develop .#ci -c cargo xtask next-release "$LATEST" "${labels[@]}")
          gh api --silent "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$COMMIT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Tell the tap about the tag
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::TAP_DISPATCH_TOKEN is not set, so the Homebrew tap does not hear about $TAG."
            exit 0
          fi
          gh api repos/KarlHarnois/homebrew-tap/dispatches -f event_type=ringleader-release -f "client_payload[tag]=$TAG"
