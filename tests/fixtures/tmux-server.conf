set -su terminal-features
source-file -q '/home/example/.config/ringleader/tmux.conf'
set -g prefix None
set -g prefix2 None
set -g status off
set -g mouse on
unbind-key -q -T root MouseDown3Pane
unbind-key -q -T root M-MouseDown3Pane
set -s escape-time 10
set -g default-terminal tmux-256color
set -s extended-keys always
set -as terminal-features ',*:extkeys'
set -as terminal-features ',*:RGB'
set -s set-clipboard on
set -s exit-unattached off
set -g destroy-unattached off
set -g detach-on-destroy on
set -g @ringleader_return_key 'C-q'
set -g @ringleader_config '1dc127c3cd73dc68'
bind-key -T root 'C-q' detach-client
