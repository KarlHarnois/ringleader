set -su terminal-features
set -g prefix None
set -g prefix2 None
set -g status off
set -g mouse on
unbind-key -q -T root MouseDown3Pane
unbind-key -q -T root M-MouseDown3Pane
set -s escape-time 10
set -g default-terminal tmux-256color
set -g history-limit 25000
set -s extended-keys always
set -as terminal-features ',*:extkeys'
set -as terminal-features ',*:RGB'
set -s set-clipboard on
set -s exit-unattached off
set -g destroy-unattached off
set -g detach-on-destroy on
set -g @ringleader_return_key 'C-q'
set -g @ringleader_next_session_keys 'M-j M-Down'
set -g @ringleader_previous_session_keys 'M-k M-Up'
set -g @ringleader_shell_toggle_keys 'M-l'
set -g @ringleader_config 'db7913abc315a89b'
bind-key -T root 'M-j' switch-client -n
bind-key -T root 'M-Down' switch-client -n
bind-key -T root 'M-k' switch-client -p
bind-key -T root 'M-Up' switch-client -p
bind-key -T root 'M-l' if-shell -F '#{@ringleader_meta}' { if-shell -F '#{@ringleader_shell}' { run-shell -C "select-window -t '#{W:#{P:#{?@ringleader_agent,#{window_id},}}}'" } { if-shell -F '#{W:#{@ringleader_shell}}' { run-shell -C "select-window -t '#{W:#{?@ringleader_shell,#{window_id},}}'" } { new-window -c '#{session_path}' ; set-option -w @ringleader_shell 1 } } }
bind-key -T root 'C-q' detach-client
bind-key -T copy-mode 'M-j' switch-client -n
bind-key -T copy-mode 'M-Down' switch-client -n
bind-key -T copy-mode 'M-k' switch-client -p
bind-key -T copy-mode 'M-Up' switch-client -p
bind-key -T copy-mode 'M-l' if-shell -F '#{@ringleader_meta}' { if-shell -F '#{@ringleader_shell}' { run-shell -C "select-window -t '#{W:#{P:#{?@ringleader_agent,#{window_id},}}}'" } { if-shell -F '#{W:#{@ringleader_shell}}' { run-shell -C "select-window -t '#{W:#{?@ringleader_shell,#{window_id},}}'" } { new-window -c '#{session_path}' ; set-option -w @ringleader_shell 1 } } }
bind-key -T copy-mode 'C-q' detach-client
bind-key -T copy-mode-vi 'M-j' switch-client -n
bind-key -T copy-mode-vi 'M-Down' switch-client -n
bind-key -T copy-mode-vi 'M-k' switch-client -p
bind-key -T copy-mode-vi 'M-Up' switch-client -p
bind-key -T copy-mode-vi 'M-l' if-shell -F '#{@ringleader_meta}' { if-shell -F '#{@ringleader_shell}' { run-shell -C "select-window -t '#{W:#{P:#{?@ringleader_agent,#{window_id},}}}'" } { if-shell -F '#{W:#{@ringleader_shell}}' { run-shell -C "select-window -t '#{W:#{?@ringleader_shell,#{window_id},}}'" } { new-window -c '#{session_path}' ; set-option -w @ringleader_shell 1 } } }
bind-key -T copy-mode-vi 'C-q' detach-client
