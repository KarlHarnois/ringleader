[package]
name = "ringleader"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "A tmux session manager for AI coding agents"
repository = "https://github.com/KarlHarnois/ringleader"

[workspace]
members = ["xtask"]

[dependencies]
ansi-to-tui = "8.0.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
dirs = "7.0.0"
env_logger = { version = "0.11.11", default-features = false, features = ["humantime"] }
libc = "0.2.190"
jiff = { version = "0.2.37", default-features = false, features = ["std"] }
log = "0.4.34"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
ratatui-textarea = "0.9.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.4"
thiserror = "2.0.21"
toml = "1.1.6"
toml_edit = "0.25.15"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.27.0"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
